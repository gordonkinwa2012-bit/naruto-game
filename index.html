<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SHINOBI DESTINY 3D: ULTIMATE</title>
    <style>
        :root { --p1: #FF6A00; --p2: #2575FC; --chakra: #00F2FE; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial Black', sans-serif; }
        
        #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        /* --- CINEMATIC HUD --- */
        .ui-layer { position: absolute; inset: 0; pointer-events: none; padding: 30px; z-index: 10; }
        .bars-container { display: flex; justify-content: space-between; }
        .fighter-hud { width: 40%; }
        .hp-bar { height: 20px; background: #222; border: 2px solid #fff; position: relative; overflow: hidden; transform: skewX(-15deg); box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .hp-fill { height: 100%; width: 100%; transition: width 0.3s ease-out; }
        .cp-bar { height: 6px; width: 80%; background: #222; margin-top: 8px; border-radius: 4px; overflow: hidden; }
        .cp-fill { height: 100%; width: 0%; background: var(--chakra); box-shadow: 0 0 10px var(--chakra); }

        /* --- STUDIO CONTROLS --- */
        .controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: space-evenly; pointer-events: auto; }
        .btn { width: 80px; height: 80px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid #fff; color: #fff; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); font-size: 12px; transition: 0.1s; }
        .btn:active { transform: scale(0.9); background: var(--chakra); }

        #start-overlay { position: absolute; inset: 0; background: radial-gradient(circle, #222 0%, #000 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #fff; }
        .title { font-size: 4rem; letter-spacing: 15px; margin: 0; text-shadow: 0 0 30px var(--p1); }
        .play-btn { margin-top: 30px; padding: 20px 60px; background: var(--p1); border: none; border-radius: 5px; color: #fff; font-size: 1.5rem; cursor: pointer; box-shadow: 0 10px 0 #b34a00; }
        .play-btn:active { transform: translateY(5px); box-shadow: none; }
    </style>
</head>
<body>

<div id="stage">
    <canvas id="c"></canvas>

    <div class="ui-layer">
        <div class="bars-container">
            <div class="fighter-hud">
                <div class="hp-bar"><div id="p1-hp" class="hp-fill" style="background: linear-gradient(90deg, #f00, #ff6a00);"></div></div>
                <div class="cp-bar"><div id="p1-cp" class="cp-fill"></div></div>
            </div>
            <div class="fighter-hud" style="display: flex; flex-direction: column; align-items: flex-end;">
                <div class="hp-bar"><div id="p2-hp" class="hp-fill" style="background: linear-gradient(-90deg, #2575FC, #6A11CB);"></div></div>
                <div class="cp-bar"><div id="p2-cp" class="cp-fill" style="width: 100%;"></div></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="btn" id="atk-btn">STRIKE</div>
        <div class="btn" id="jutsu-btn" style="border-color: var(--chakra)">JUTSU</div>
        <div class="btn" id="move-btn" style="border-color: #ff0">DASH</div>
    </div>

    <div id="start-overlay">
        <h1 class="title">SHINOBI</h1>
        <p>3D ULTIMATE BATTLE</p>
        <button class="play-btn" onclick="start()">INITIATE FIGHT</button>
    </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h, frame = 0, isRunning = false;

// --- 3D ENGINE CONSTANTS ---
const FOV = 400;
const HORIZON = 0.5;

// --- FIGHTER OBJECTS ---
const p1 = { x: -200, z: 0, hp: 100, cp: 0, color: '#FF6A00', state: 'idle', atk: false };
const p2 = { x: 200, z: 0, hp: 100, cp: 100, color: '#2575FC', state: 'idle', atk: false };
const particles = [];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- 3D PROJECTION ---
function project(x, z) {
    const scale = FOV / (FOV + z);
    return {
        x: (w / 2) + (x * scale),
        y: (h * HORIZON) + (150 * scale),
        s: scale
    };
}

function spawnSpark(x, y, color) {
    for(let i=0; i<10; i++) {
        particles.push({
            x, y, 
            vx: (Math.random()-0.5)*15, 
            vy: (Math.random()-0.5)*15, 
            life: 1, 
            color
        });
    }
}

function update() {
    frame++;
    
    // AI LOGIC (3D Movement)
    const dist = Math.abs(p1.x - p2.x);
    if(dist > 100) {
        p2.x += (p1.x > p2.x ? 3 : -3);
        p2.z += (p1.z > p2.z ? 1 : -1);
    } else if(frame % 50 === 0) {
        p2.atk = true;
        setTimeout(() => p2.atk = false, 200);
        checkHit(p2, p1);
    }

    // Player CP Charge
    if(p1.cp < 100) p1.cp += 0.2;

    // Particles
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.05;
        if(p.life <= 0) particles.splice(i, 1);
    });

    // UI
    document.getElementById('p1-hp').style.width = p1.hp + '%';
    document.getElementById('p2-hp').style.width = p2.hp + '%';
    document.getElementById('p1-cp').style.width = p1.cp + '%';
}

function checkHit(attacker, target) {
    const dist = Math.sqrt(Math.pow(attacker.x - target.x, 2) + Math.pow(attacker.z - target.z, 2));
    if(dist < 120) {
        target.hp -= 5;
        const pos = project(target.x, target.z);
        spawnSpark(pos.x, pos.y - 50, '#fff');
        if(window.navigator.vibrate) window.navigator.vibrate(50);
    }
}

function draw() {
    ctx.clearRect(0, 0, w, h);

    // DRAW SKY
    const sky = ctx.createLinearGradient(0, 0, 0, h * HORIZON);
    sky.addColorStop(0, '#001'); sky.addColorStop(1, '#202');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h * HORIZON);

    // DRAW 3D GROUND
    ctx.fillStyle = '#111';
    ctx.fillRect(0, h * HORIZON, w, h * (1-HORIZON));
    
    // Grid Perspective
    ctx.strokeStyle = 'rgba(0, 242, 254, 0.1)';
    for(let i = -10; i <= 10; i++) {
        const pStart = project(i * 200, -200);
        const pEnd = project(i * 500, 1000);
        ctx.beginPath();
        ctx.moveTo(pStart.x, pStart.y);
        ctx.lineTo(pEnd.x, pEnd.y);
        ctx.stroke();
    }

    // DRAW CHARACTERS (Sorted by depth)
    const fighters = [p1, p2].sort((a,b) => b.z - a.z);
    
    fighters.forEach(f => {
        const p = project(f.x, f.z);
        const size = 180 * p.s;

        ctx.save();
        ctx.translate(p.x, p.y);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath(); ctx.ellipse(0, 0, size/2, size/6, 0, 0, Math.PI*2); ctx.fill();

        // 3D Visual Model
        ctx.shadowBlur = 20 * p.s;
        ctx.shadowColor = f.color;
        
        // Body
        ctx.fillStyle = f.color;
        if(f.atk) {
            ctx.translate(f === p1 ? 20 : -20, 0); // Lunge
            ctx.fillStyle = '#fff';
        }
        ctx.fillRect(-size/4, -size, size/2, size);
        
        // Face/Hair
        ctx.fillStyle = '#FADBB1';
        ctx.fillRect(-size/6, -size - size/4, size/3, size/4);
        
        ctx.restore();
    });

    // DRAW PARTICLES
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 4, 4);
    });
    ctx.globalAlpha = 1;

    if(isRunning) {
        update();
        requestAnimationFrame(draw);
    }
}

function start() {
    document.getElementById('start-overlay').style.display = 'none';
    isRunning = true;
    draw();
}

// CONTROLS
document.getElementById('atk-btn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    p1.atk = true;
    checkHit(p1, p2);
    setTimeout(() => p1.atk = false, 150);
});

// MOVE CONTROL (Swipe logic)
let startX = 0, startY = 0;
window.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
});
window.addEventListener('touchmove', e => {
    if(!isRunning) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    p1.x += dx * 0.1;
    p1.z -= dy * 0.1; // Moving Y on touch moves Z in 3D
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
});
</script>
</body>
</html>
