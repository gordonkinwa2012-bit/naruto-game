<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Naruto: Ninja Clash Pro</title>
    <style>
        :root {
            --naruto-orange: #FF6700;
            --leaf-green: #4CAF50;
            --chakra-blue: #00E5FF;
            --health-red: #FF3D00;
            --ui-glass: rgba(0, 0, 0, 0.6);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: 'Segoe UI', Roboto, sans-serif;
            user-select: none; touch-action: none;
        }

        #stage {
            position: relative; width: 100vw; height: 100vh;
            perspective: 1000px;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
            overflow: hidden;
        }

        /* 3D ENVIRONMENT */
        .world {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
        }

        .ground {
            position: absolute; bottom: 0; width: 200%; height: 50%;
            background: repeating-linear-gradient(90deg, #2d5a27 0px, #2d5a27 50px, #244a1f 50px, #244a1f 100px);
            transform: rotateX(70deg); transform-origin: bottom;
            left: -50%; filter: brightness(0.8);
        }

        /* PROFESSIONAL UI */
        .hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px;
            display: flex; justify-content: space-between; z-index: 50;
            pointer-events: none;
        }

        .status-group {
            background: var(--ui-glass); padding: 15px; border-radius: 0 20px 20px 0;
            border-left: 5px solid var(--naruto-orange); backdrop-filter: blur(10px);
        }

        .bar-bg { width: 200px; height: 12px; background: #333; border-radius: 6px; margin: 5px 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); }
        .bar-fill { height: 100%; transition: width 0.3s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        #hp-fill { background: linear-gradient(90deg, #ff3d00, #ff9100); width: 100%; box-shadow: 0 0 10px var(--health-red); }
        #cp-fill { background: linear-gradient(90deg, #00e5ff, #00a1ff); width: 100%; box-shadow: 0 0 10px var(--chakra-blue); }

        .score-panel { text-align: right; color: white; text-shadow: 0 0 10px rgba(0,0,0,1); }
        .ryo-text { color: #FFD700; font-weight: bold; font-size: 24px; }

        /* CONTROLS */
        .action-grid {
            position: absolute; bottom: 30px; right: 30px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
            z-index: 100;
        }

        .jutsu-btn {
            width: 75px; height: 75px; border-radius: 50%;
            background: var(--ui-glass); border: 2px solid var(--chakra-blue);
            color: white; font-weight: bold; font-size: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(5px); pointer-events: auto;
            transition: transform 0.1s;
        }

        .jutsu-btn:active { transform: scale(0.9); background: var(--chakra-blue); }

        /* CHARACTER MODELS (CSS3D/2D Hybrid) */
        .entity {
            position: absolute; bottom: 20%; transform-style: preserve-3d;
            transition: transform 0.1s;
        }

        .sprite {
            width: 80px; height: 110px;
            background-size: contain; background-repeat: no-repeat;
            position: relative;
        }

        /* Naruto CSS Model */
        .naruto-model {
            background: #ff6700; border-radius: 10px; border: 3px solid black;
            box-shadow: inset 0 -20px rgba(0,0,0,0.2);
        }
        .naruto-model::after {
            content: '🍥'; position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-size: 40px;
        }

        /* MENU SYSTEMS */
        .overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; color: white; gap: 20px;
        }

        .btn-main {
            padding: 15px 50px; font-size: 20px; font-weight: bold;
            background: var(--naruto-orange); border: none; border-radius: 50px;
            color: white; box-shadow: 0 5px 0 #b34700;
        }

        .btn-main:active { transform: translateY(5px); box-shadow: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="stage">
    <div class="world" id="world">
        <div class="ground" id="ground"></div>
    </div>

    <div class="hud">
        <div class="status-group">
            <div style="color:white; font-size: 12px; font-weight:bold;">SHINOBI VITALS</div>
            <div class="bar-bg"><div id="hp-fill" class="bar-fill"></div></div>
            <div class="bar-bg"><div id="cp-fill" class="bar-fill"></div></div>
        </div>
        <div class="score-panel">
            <div class="ryo-text">RYO: <span id="ryo-val">0</span></div>
            <div style="font-size: 18px;">SCORE: <span id="score-val">0</span></div>
        </div>
    </div>

    <div class="action-grid">
        <button class="jutsu-btn" id="btn-shuriken">SHURIKEN<br><span>(5 CP)</span></button>
        <button class="jutsu-btn" id="btn-clone" style="border-color: #fff;">CLONE<br><span>(30 CP)</span></button>
        <button class="jutsu-btn" id="btn-special" style="border-color: var(--naruto-orange);">ULTIMATE<br><span>(MAX)</span></button>
    </div>

    <div id="menu-start" class="overlay">
        <h1 style="font-size: 48px; color: var(--naruto-orange); text-shadow: 0 0 20px #fff;">NINJA CLASH</h1>
        <p>CHOOSE YOUR SHINOBI</p>
        <div style="display:flex; gap: 20px;">
            <button class="btn-main" onclick="initGame('naruto')">NARUTO</button>
            <button class="btn-main" style="background:#4a148c" onclick="initGame('sasuke')">SASUKE</button>
        </div>
    </div>

    <div id="menu-death" class="overlay hidden">
        <h1 style="color: var(--health-red);">MISSION FAILED</h1>
        <button class="btn-main" onclick="location.reload()">REDEPLOY</button>
    </div>
</div>

<script>
/** * PROFESSIONAL GAME ENGINE
 */
const CONFIG = {
    gravity: 0.8,
    jumpStrength: -16,
    groundY: 0.8,
    maxHp: 100,
    maxCp: 100
};

const state = {
    playing: false,
    score: 0,
    ryo: parseInt(localStorage.getItem('ryo_pro')) || 0,
    hp: 100,
    cp: 100,
    pos: { x: 100, y: 0 },
    vel: { x: 0, y: 0 },
    isJumping: false,
    enemies: [],
    particles: [],
    bgOffset: 0
};

// Character Template
const playerEl = document.createElement('div');
playerEl.className = 'entity';
playerEl.innerHTML = `<div class="sprite naruto-model" id="player-sprite"></div>`;

/**
 * AUDIO SYNTHESIZER
 */
const audio = new (window.AudioContext || window.webkitAudioContext)();
function playSfx(f, t, d, v=0.1) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = t; o.frequency.setValueAtTime(f, audio.currentTime);
    g.gain.setValueAtTime(v, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + d);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + d);
}

/**
 * GAME CORE
 */
function initGame(hero) {
    document.getElementById('menu-start').classList.add('hidden');
    document.getElementById('world').appendChild(playerEl);
    state.playing = true;
    if(hero === 'sasuke') {
        document.getElementById('player-sprite').style.background = '#2a2a72';
    }
    gameLoop();
}

// Input Controllers
window.addEventListener('touchstart', (e) => {
    if(!state.playing) return;
    const touchY = e.touches[0].clientY;
    if(touchY < window.innerHeight / 2 && !state.isJumping) {
        state.vel.y = CONFIG.jumpStrength;
        state.isJumping = true;
        playSfx(400, 'triangle', 0.2);
    }
});

document.getElementById('btn-shuriken').addEventListener('click', () => {
    if(state.cp >= 5) {
        state.cp -= 5;
        createProjectile(state.pos.x + 50, window.innerHeight * 0.7);
        playSfx(800, 'sine', 0.1);
    }
});

function createProjectile(x, y) {
    const p = document.createElement('div');
    p.style.cssText = `position:absolute; left:${x}px; top:${y}px; font-size:20px; z-index:10;`;
    p.innerHTML = '🎯';
    document.getElementById('world').appendChild(p);
    
    let px = x;
    const pAnim = setInterval(() => {
        px += 15;
        p.style.left = px + 'px';
        
        // Simple collision
        state.enemies.forEach((en, i) => {
            if(px > en.x && px < en.x + 50) {
                en.hp -= 50;
                if(en.hp <= 0) destroyEnemy(en, i);
                p.remove();
                clearInterval(pAnim);
            }
        });

        if(px > window.innerWidth) { p.remove(); clearInterval(pAnim); }
    }, 16);
}

function spawnEnemy() {
    const en = {
        x: window.innerWidth + 100,
        hp: 100,
        el: document.createElement('div')
    };
    en.el.className = 'entity';
    en.el.innerHTML = `<div class="sprite" style="background:#000; border:2px solid red;"></div><div style="color:red; text-align:center">RENEGADE</div>`;
    document.getElementById('world').appendChild(en.el);
    state.enemies.push(en);
}

function destroyEnemy(en, index) {
    if (window.navigator.vibrate) window.navigator.vibrate(50);
    en.el.remove();
    state.enemies.splice(index, 1);
    state.score += 100;
    state.ryo += 10;
    playSfx(100, 'sawtooth', 0.3);
}

function update() {
    if(!state.playing) return;

    // Physics
    state.vel.y += CONFIG.gravity;
    state.pos.y += state.vel.y;

    const floor = window.innerHeight * 0.7;
    if(state.pos.y > floor) {
        state.pos.y = floor;
        state.vel.y = 0;
        state.isJumping = false;
    }

    // Parallax Ground
    state.bgOffset -= 5;
    document.getElementById('ground').style.backgroundPositionX = state.bgOffset + 'px';

    // Character Rendering
    playerEl.style.transform = `translate3d(${state.pos.x}px, ${state.pos.y}px, 0) scale(${1 + (state.pos.y/2000)})`;
    
    // Enemy AI
    state.enemies.forEach((en, i) => {
        en.x -= 6;
        en.el.style.transform = `translate3d(${en.x}px, ${floor}px, 0)`;
        
        // Hit Player
        if(en.x > state.pos.x && en.x < state.pos.x + 40 && state.pos.y > floor - 50) {
            state.hp -= 1;
            if(state.hp <= 0) endGame();
        }

        if(en.x < -100) {
            en.el.remove();
            state.enemies.splice(i, 1);
        }
    });

    if(Math.random() < 0.01) spawnEnemy();

    // UI Bars
    state.cp = Math.min(100, state.cp + 0.2);
    document.getElementById('hp-fill').style.width = state.hp + '%';
    document.getElementById('cp-fill').style.width = state.cp + '%';
    document.getElementById('ryo-val').innerText = state.ryo;
    document.getElementById('score-val').innerText = state.score;
}

function endGame() {
    state.playing = false;
    localStorage.setItem('ryo_pro', state.ryo);
    document.getElementById('menu-death').classList.remove('hidden');
}

function gameLoop() {
    update();
    if(state.playing) requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
