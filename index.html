<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NARUTO: SHINOBI DESTINY 3D</title>
    <style>
        :root {
            --chakra: #00f2fe;
            --health: #ff0844;
            --ui-gold: #fccb90;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        canvas { width: 100%; height: 100%; object-fit: cover; }

        /* --- CINEMATIC HUD --- */
        .hud-overlay {
            position: absolute; inset: 0; pointer-events: none;
            padding: 40px; z-index: 10;
        }

        .fighter-stats {
            display: flex; justify-content: space-between; align-items: flex-start;
        }

        .hp-bar-wrapper {
            width: 40%; height: 25px; background: rgba(0,0,0,0.6);
            border: 2px solid #fff; transform: skewX(-20deg);
            overflow: hidden; box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .hp-fill {
            height: 100%; width: 100%; background: linear-gradient(90deg, #ff0844, #ffb199);
            transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .chakra-bar {
            width: 60%; height: 8px; background: var(--chakra);
            margin-top: 10px; border-radius: 0 0 5px 5px;
            box-shadow: 0 0 10px var(--chakra);
        }

        /* --- ACTION BUTTONS --- */
        .controls {
            position: absolute; bottom: 40px; width: 100%;
            display: flex; justify-content: space-around; pointer-events: auto;
        }

        .btn-circle {
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 2px solid #fff;
            backdrop-filter: blur(10px); color: #fff; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-size: 12px; transition: 0.1s;
        }

        .btn-circle:active { transform: scale(0.9); background: var(--chakra); }

        /* --- CINEMATIC EFFECTS --- */
        #flash-fx {
            position: absolute; inset: 0; background: #fff; opacity: 0;
            pointer-events: none; z-index: 100;
        }

        .combo-counter {
            position: absolute; left: 50px; top: 150px;
            color: var(--ui-gold); font-size: 40px; font-style: italic;
            font-weight: 900; opacity: 0; transform: translateX(-50px);
            transition: 0.3s;
        }

        #start-screen {
            position: absolute; inset: 0; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; color: #fff; text-align: center;
        }

        .btn-play {
            padding: 20px 80px; background: #ff6a00; border: none;
            color: #fff; font-size: 24px; font-weight: bold;
            border-radius: 5px; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="flash-fx"></div>
    
    <div class="hud-overlay">
        <div class="fighter-stats">
            <div style="width: 45%;">
                <div style="color: #fff; margin-bottom: 5px;">NARUTO (P1)</div>
                <div class="hp-bar-wrapper"><div id="p1-hp" class="hp-fill"></div></div>
                <div id="p1-cp" class="chakra-bar" style="width: 100%"></div>
            </div>
            <div style="width: 45%; display: flex; flex-direction: column; align-items: flex-end;">
                <div style="color: #fff; margin-bottom: 5px;">SASUKE (AI)</div>
                <div class="hp-bar-wrapper"><div id="p2-hp" class="hp-fill" style="background: linear-gradient(-90deg, #6a11cb, #2575fc)"></div></div>
                <div id="p2-cp" class="chakra-bar" style="width: 100%; background: #6a11cb"></div>
            </div>
        </div>
        <div id="combo" class="combo-counter">12 HIT!</div>
    </div>

    <div class="controls">
        <div class="btn-circle" id="btn-atk">STRIKE<br>(TAP)</div>
        <div class="btn-circle" id="btn-jutsu" style="border-color: var(--chakra)">JUTSU<br>(SWIPE)</div>
        <div class="btn-circle" id="btn-ult" style="border-color: #ff0">ULTIMATE<br>(MAX)</div>
    </div>

    <div id="start-screen">
        <h1 style="font-size: 60px; letter-spacing: 10px;">NARUTO</h1>
        <p style="color: var(--chakra)">SHINOBI DESTINY: 3D ARENA</p>
        <button class="btn-play" onclick="initGame()">FIGHT</button>
    </div>
</div>

<script>
/**
 * PROFESSIONAL 3D FIGHTER ENGINE
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const flash = document.getElementById('flash-fx');

let width, height;
let isRunning = false;
let frame = 0;

const world = {
    horizon: 0.45, // 3D Horizon line
    cameraZ: 0,
    zoom: 1,
    shake: 0
};

const p1 = {
    x: -200, z: 0, hp: 100, cp: 100, 
    state: 'idle', frame: 0, 
    dir: 1, color: '#ff6a00'
};

const ai = {
    x: 200, z: 0, hp: 100, cp: 100, 
    state: 'idle', frame: 0, 
    dir: -1, color: '#2575fc'
};

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

/**
 * 3D PROJECTION MATH
 */
function project(obj) {
    const perspective = 800;
    const scale = perspective / (perspective + obj.z + world.cameraZ);
    const screenX = width/2 + (obj.x * scale);
    const screenY = height * world.horizon + (200 * scale);
    return { x: screenX, y: screenY, s: scale };
}

/**
 * CINEMATIC DRAWING
 */
function drawBackground() {
    // Cinematic Sky (Valley of the End style)
    const grad = ctx.createLinearGradient(0, 0, 0, height * world.horizon);
    grad.addColorStop(0, '#1a2a6c');
    grad.addColorStop(0.5, '#b21f1f');
    grad.addColorStop(1, '#fdbb2d');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height * world.horizon);

    // 3D Ground
    ctx.fillStyle = '#222';
    ctx.fillRect(0, height * world.horizon, width, height * (1 - world.horizon));

    // Perspective Lines (Speed effect)
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    for(let i = -10; i <= 10; i++) {
        ctx.beginPath();
        const start = project({x: i * 200, z: -500});
        const end = project({x: i * 1000, z: 1000});
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
    }
}

function drawFighter(f) {
    const proj = project(f);
    const h = 250 * proj.s;
    const w = 100 * proj.s;

    ctx.save();
    ctx.translate(proj.x, proj.y);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 0, w, w/3, 0, 0, Math.PI*2);
    ctx.fill();

    // Model Body (Simplified Professional Geometry)
    ctx.shadowBlur = 15 * proj.s;
    ctx.shadowColor = f.color;

    // Movement Bobbing
    const bob = Math.sin(frame * 0.1) * 5;
    
    // Core Mesh
    ctx.fillStyle = f.color;
    ctx.fillRect(-w/2, -h + bob, w, h);
    
    // Head & Hair
    ctx.fillStyle = '#FADBB1';
    ctx.fillRect(-w/4, -h - w/2 + bob, w/2, w/2);
    
    // Action Aura
    if(f.state === 'attacking') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.strokeRect(-w/2 - 10, -h + bob - 10, w + 20, h + 20);
    }

    ctx.restore();
}

/**
 * CORE LOGIC
 */
function update() {
    frame++;
    
    // AI Simple Behavior
    const dist = Math.abs(p1.x - ai.x);
    if(dist > 150) {
        ai.x += (p1.x > ai.x ? 2 : -2);
        ai.state = 'running';
    } else {
        ai.state = 'idle';
        if(frame % 60 === 0) performAtk(ai, p1);
    }

    // Camera follow
    const centerX = (p1.x + ai.x) / 2;
    world.cameraZ = Math.max(0, dist - 400);

    // HUD Update
    document.getElementById('p1-hp').style.width = p1.hp + '%';
    document.getElementById('p2-hp').style.width = ai.hp + '%';
    
    if(world.shake > 0) {
        world.shake--;
        ctx.translate(Math.random()*10 - 5, Math.random()*10 - 5);
    }
}

function performAtk(attacker, target) {
    attacker.state = 'attacking';
    setTimeout(() => attacker.state = 'idle', 300);
    
    const dist = Math.abs(attacker.x - target.x);
    if(dist < 200) {
        target.hp -= 5;
        world.shake = 10;
        // Hit Flash
        flash.style.opacity = 0.3;
        setTimeout(() => flash.style.opacity = 0, 50);
        
        // Vibration (Android)
        if(window.navigator.vibrate) window.navigator.vibrate(50);
    }
}

function loop() {
    if(!isRunning) return;
    ctx.clearRect(0, 0, width, height);
    
    update();
    drawBackground();
    drawFighter(p1);
    drawFighter(ai);

    requestAnimationFrame(loop);
}

function initGame() {
    document.getElementById('start-screen').style.display = 'none';
    isRunning = true;
    loop();
}

// Controls
document.getElementById('btn-atk').addEventListener('touchstart', (e) => {
    e.preventDefault();
    performAtk(p1, ai);
});

// Dynamic Movement (Joystick-less Swipe)
let startX = 0;
canvas.addEventListener('touchstart', e => startX = e.touches[0].clientX);
canvas.addEventListener('touchmove', e => {
    const diff = e.touches[0].clientX - startX;
    p1.x += diff * 0.1;
    startX = e.touches[0].clientX;
});

</script>
</body>
</html>
