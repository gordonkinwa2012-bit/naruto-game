<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Naruto: Shinobi Stride ULTIMATE</title>
    <style>
        :root {
            --naruto-orange: #FF6700;
            --chakra-blue: #00E5FF;
            --health-red: #FF3D00;
            --gold: #FFD700;
            --glass: rgba(0, 0, 0, 0.7);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: 'Arial Black', sans-serif;
            user-select: none; touch-action: none;
        }

        #game-wrapper {
            position: relative; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        canvas {
            position: absolute; width: 100%; height: 100%;
            object-fit: cover; background: #111;
        }

        /* --- STUDIO UI --- */
        .hud {
            position: absolute; inset: 0; pointer-events: none;
            padding: env(safe-area-inset-top) 20px;
            z-index: 100;
        }

        .stats-left {
            position: absolute; top: 20px; left: 20px;
            background: var(--glass); padding: 10px 20px;
            border-left: 6px solid var(--naruto-orange);
            border-radius: 0 15px 15px 0; backdrop-filter: blur(8px);
        }

        .bar-container {
            width: 220px; height: 14px; background: #222;
            margin: 5px 0; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; overflow: hidden; position: relative;
        }

        .bar-fill {
            height: 100%; width: 100%; transition: width 0.2s ease-out;
            box-shadow: 0 0 15px currentColor;
        }

        #hp-fill { background: var(--health-red); color: var(--health-red); }
        #cp-fill { background: var(--chakra-blue); color: var(--chakra-blue); }

        .score-box {
            position: absolute; top: 20px; right: 20px; text-align: right;
            color: #fff; text-shadow: 0 0 10px #000;
        }

        /* --- ABILITY WHEEL --- */
        .controls {
            position: absolute; bottom: 40px; right: 40px;
            display: flex; gap: 15px; pointer-events: auto;
        }

        .ability-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: var(--glass); border: 3px solid #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-size: 10px; font-weight: bold;
            transition: 0.1s; backdrop-filter: blur(10px);
        }

        .ability-btn:active { transform: scale(0.8) rotate(-10deg); border-color: var(--naruto-orange); }
        .ability-btn.locked { opacity: 0.5; border-color: #555; }

        /* --- CINEMATIC OVERLAYS --- */
        #flash {
            position: absolute; inset: 0; background: #fff; opacity: 0;
            pointer-events: none; z-index: 200;
        }

        .screen-msg {
            position: absolute; top: 40%; width: 100%; text-align: center;
            font-size: 60px; color: #fff; font-style: italic;
            text-shadow: 0 0 30px var(--naruto-orange);
            transform: scale(0); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; z-index: 150;
        }

        .show-msg { transform: scale(1.2); }

        .menu {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; color: #fff;
        }

        .btn-start {
            padding: 20px 60px; background: var(--naruto-orange);
            border: none; border-radius: 50px; color: #fff;
            font-size: 24px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 20px var(--naruto-orange);
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <canvas id="mainCanvas"></canvas>
    <div id="flash"></div>
    <div id="msg" class="screen-msg">RASENGAN!</div>

    <div class="hud">
        <div class="stats-left">
            <div style="font-size: 10px; letter-spacing: 2px;">SHINOBI DATA</div>
            <div class="bar-container"><div id="hp-fill" class="bar-fill"></div></div>
            <div class="bar-container"><div id="cp-fill" class="bar-fill"></div></div>
        </div>
        <div class="score-box">
            <div style="color: var(--gold); font-size: 24px;" id="ryo-ui">RYO 0</div>
            <div id="score-ui">SCORE 0</div>
        </div>
    </div>

    <div class="controls">
        <div class="ability-btn" onclick="triggerJutsu('shuriken')">PROJECTILE<br>5 CP</div>
        <div class="ability-btn" onclick="triggerJutsu('rasengan')" style="border-color: var(--chakra-blue)">RASENGAN<br>40 CP</div>
        <div class="ability-btn" onclick="triggerJutsu('ultimate')" style="border-color: var(--naruto-orange)">ULTIMATE<br>100 CP</div>
    </div>

    <div id="start-screen" class="menu">
        <h1 style="font-size: 50px; margin-bottom: 10px;">SHINOBI <span style="color:var(--naruto-orange)">STRIDE</span></h1>
        <p style="margin-bottom: 30px; opacity: 0.7;">ULTIMATE STUDIO EDITION</p>
        <button class="btn-start" onclick="startGame()">ENTER BATTLE</button>
    </div>
</div>

<script>
/** * ULTIMATE NINJA ENGINE 
 * Hand-coded studio-grade mechanics
 */

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const flash = document.getElementById('flash');

// Game Settings
let width, height;
let frame = 0;
let isRunning = false;
const particles = [];
const enemies = [];
const projectiles = [];

const player = {
    x: 100, y: 0, w: 60, h: 90,
    hp: 100, cp: 100,
    velY: 0, isJumping: false,
    state: 'run', // run, jump, attack
    score: 0, ryo: 0
};

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    player.y = height * 0.7 - player.h;
}
window.addEventListener('resize', resize);
resize();

/** AUDIO ENGINE **/
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, type, dur, vol=0.1) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

/** VFX SYSTEM **/
class Particle {
    constructor(x, y, color, size, vx, vy) {
        this.x = x; this.y = y; this.color = color;
        this.size = size; this.vx = vx; this.vy = vy;
        this.alpha = 1;
    }
    update() {
        this.x += this.vx; this.y += this.vy;
        this.alpha -= 0.02;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
}

function createBurst(x, y, color) {
    for(let i=0; i<15; i++) {
        particles.push(new Particle(x, y, color, Math.random()*5, (Math.random()-0.5)*10, (Math.random()-0.5)*10));
    }
}

/** GAME LOGIC **/
function triggerJutsu(type) {
    if(!isRunning) return;
    
    if(type === 'shuriken' && player.cp >= 5) {
        player.cp -= 5;
        projectiles.push({x: player.x + 50, y: player.y + 40, type: 'kunai'});
        playSound(600, 'sine', 0.1);
    } 
    else if(type === 'rasengan' && player.cp >= 40) {
        player.cp -= 40;
        showCinematic("RASENGAN!", "#00E5FF");
        createBurst(player.x + 100, player.y + 45, "#00E5FF");
        // Logic to clear screen
        enemies.forEach((e, i) => {
            if(e.x < width) {
                createBurst(e.x, e.y, "#ff0");
                enemies.splice(i, 1);
            }
        });
    }
    else if(type === 'ultimate' && player.cp >= 95) {
        player.cp = 0;
        showCinematic("Tailed Beast Bomb!", "#FF3D00");
        flash.style.opacity = 1;
        setTimeout(() => flash.style.opacity = 0, 500);
        enemies.length = 0;
        player.score += 500;
    }
}

function showCinematic(text, color) {
    msg.innerText = text;
    msg.style.textShadow = `0 0 30px ${color}`;
    msg.classList.add('show-msg');
    if (window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
    setTimeout(() => msg.classList.remove('show-msg'), 1500);
}

function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    isRunning = true;
    loop();
}

function update() {
    frame++;

    // Gravity & Ground
    const ground = height * 0.75;
    if(player.isJumping) {
        player.velY += 1;
        player.y += player.velY;
        if(player.y >= ground - player.h) {
            player.y = ground - player.h;
            player.isJumping = false;
        }
    }

    // Regeneration
    if(player.cp < 100) player.cp += 0.1;

    // Spawn Enemies
    if(frame % 100 === 0) {
        enemies.push({x: width + 50, y: ground - 90, w: 60, h: 90, speed: 5 + (frame/1000)});
    }

    // Move Enemies
    enemies.forEach((e, i) => {
        e.x -= e.speed;
        if(e.x < -100) enemies.splice(i, 1);

        // Collision with player
        if(e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h) {
            player.hp -= 0.5;
            if(player.hp <= 0) location.reload();
        }
    });

    // Move Projectiles
    projectiles.forEach((p, i) => {
        p.x += 15;
        enemies.forEach((e, ei) => {
            if(p.x > e.x && p.x < e.x + e.w && p.y > e.y) {
                createBurst(e.x, e.y, "#fff");
                enemies.splice(ei, 1);
                projectiles.splice(i, 1);
                player.score += 50;
                player.ryo += 5;
            }
        });
    });

    particles.forEach((p, i) => {
        p.update();
        if(p.alpha <= 0) particles.splice(i, 1);
    });

    // Update HUD
    document.getElementById('hp-fill').style.width = player.hp + '%';
    document.getElementById('cp-fill').style.width = player.cp + '%';
    document.getElementById('score-ui').innerText = "SCORE " + Math.floor(player.score);
    document.getElementById('ryo-ui').innerText = "RYO " + player.ryo;
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    // Background Layers
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, width, height);
    
    // Draw Ground
    ctx.fillStyle = '#222';
    ctx.fillRect(0, height * 0.75, width, height * 0.25);
    ctx.strokeStyle = varProperty('--chakra-blue');
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, height * 0.75); ctx.lineTo(width, height * 0.75); ctx.stroke();

    // Draw Player Body (Professional Proportions)
    ctx.save();
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(player.x + player.w/2, player.y + player.h, 30, 10, 0, 0, Math.PI*2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#FF6700'; // Jumpsuit
    ctx.fillRect(player.x + 10, player.y + 30, 40, 40);
    ctx.fillStyle = '#333'; // Pants
    ctx.fillRect(player.x + 10, player.y + 70, 40, 20);
    ctx.fillStyle = '#FADBB1'; // Face
    ctx.fillRect(player.x + 15, player.y, 30, 30);
    ctx.fillStyle = '#FFD700'; // Hair
    ctx.fillRect(player.x + 10, player.y - 10, 40, 15);
    
    // Chakra Aura
    ctx.shadowBlur = 20;
    ctx.shadowColor = player.cp > 90 ? 'red' : 'cyan';
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(player.x + 10, player.y, 40, 90);
    ctx.restore();

    // Draw Enemies
    enemies.forEach(e => {
        ctx.fillStyle = '#333';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = 'red';
        ctx.fillRect(e.x + 10, e.y + 10, 10, 10); // Glowing eye
    });

    // Draw Projectiles
    ctx.fillStyle = '#fff';
    projectiles.forEach(p => ctx.fillRect(p.x, p.y, 15, 4));

    particles.forEach(p => p.draw());
}

function varProperty(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name);
}

function loop() {
    if(!isRunning) return;
    update();
    draw();
    requestAnimationFrame(loop);
}

// Input: Tap to Jump
window.addEventListener('touchstart', (e) => {
    if(e.target.className.includes('ability-btn')) return;
    if(!player.isJumping) {
        player.isJumping = true;
        player.velY = -20;
        playSound(200, 'square', 0.2);
    }
});
</script>
</body>
</html>
